<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyFinBank — Transactions</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">⬡ <span>MyFin</span>Bank</div>
  <div class="navbar-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="transactions.html" class="active">Transactions</a>
    <a href="loans.html">Loans</a>
    <a href="investments.html">Invest</a>
    <a href="emi.html">EMI Calc</a>
  </div>
  <div class="navbar-user">
    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-item" onclick="location.href='dashboard.html'"><span class="icon">🏠</span> Dashboard</div>
    <div class="sidebar-item active" onclick="location.href='transactions.html'"><span class="icon">📋</span> Transactions</div>
    <div class="sidebar-item" onclick="location.href='loans.html'"><span class="icon">🏦</span> Loans</div>
    <div class="sidebar-item" onclick="location.href='investments.html'"><span class="icon">📈</span> Investments</div>
    <div class="sidebar-item" onclick="location.href='emi.html'"><span class="icon">🧮</span> EMI Calculator</div>
    <div class="divider"></div>
    <div class="sidebar-item" onclick="logout()"><span class="icon">🚪</span> Logout</div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h2>Transaction History</h2>
      <p>All your account transactions with unique transaction IDs</p>
    </div>

    <!-- Transaction Table (populated by transactions.js) -->
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Description</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="tx-table-body">
            <!-- Rows are injected by transactions.js -->
          </tbody>
        </table>
      </div>
      <!-- Shown when list is empty -->
      <div id="tx-empty" class="empty-state" style="display:none;">
        <div class="icon">📭</div>
        <p>No transactions found yet.</p>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/transactions.js"></script>
</body>
</html>
