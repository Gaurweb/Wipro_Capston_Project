<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyFinBank — Admin Login</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* Admin variant: slightly different accent to distinguish from customer portal */
    :root { --gold: #b8860b; --gold-light: #daa520; }
    .auth-logo h1 { color: #daa520; }
    .admin-badge {
      display: inline-block;
      background: rgba(218,165,32,0.12);
      border: 1px solid rgba(218,165,32,0.3);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.72rem;
      color: #daa520;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="admin-badge">🛡 Admin Portal</div>
      <h1>MyFin Bank</h1>
      <p>Bank Staff Access Only</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn"        onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="tab-login" class="tab-content active">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="login-email" placeholder="admin@myfinbank.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-full" onclick="handleAdminLogin()">Sign In</button>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" class="tab-content">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Admin Name"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="admin@myfinbank.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters"/>
      </div>
      <button class="btn btn-primary btn-full" onclick="handleAdminRegister()">Create Admin Account</button>
    </div>

    <div class="auth-footer">
      <a href="../index.html">← Back to Home</a>
      &nbsp;|&nbsp;
      <a href="login.html">Customer Portal</a>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
/**
 * admin-login page inline script
 * --------------------------------
 * Tab switcher + login + register for Admin.
 * Very similar to customer login but uses adminLogin/adminRegister API calls.
 */

function switchTab(tabName) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(`tab-${tabName}`).classList.add("active");
  const btns = document.querySelectorAll(".tab-btn");
  if (tabName === "login")    btns[0].classList.add("active");
  if (tabName === "register") btns[1].classList.add("active");
}

async function handleAdminLogin() {
  const email    = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  if (!email || !password) { showToast("Please enter email and password.", "error"); return; }

  showLoader();
  try {
    // loginAdmin() → POST /api/admin/auth/login  (defined in api.js)
    const token = await loginAdmin(email, password);
    saveToken(token);
    saveRole("admin");
    showToast("Admin login successful!", "success");
    setTimeout(() => { window.location.href = "admin-dashboard.html"; }, 800);
  } catch (error) {
    showToast(error.message || "Admin login failed.", "error");
  } finally {
    hideLoader();
  }
}

async function handleAdminRegister() {
  const name     = document.getElementById("reg-name").value.trim();
  const email    = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-password").value;

  if (!name || !email || !password) { showToast("All fields are required.", "error"); return; }

  showLoader();
  try {
    // registerAdmin() → POST /api/admin/auth/register  (defined in api.js)
    const msg = await registerAdmin(name, email, password);
    showToast(msg || "Admin account created!", "success");
    setTimeout(() => switchTab("login"), 1200);
  } catch (error) {
    showToast(error.message || "Registration failed.", "error");
  } finally {
    hideLoader();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const tab = document.querySelector(".tab-content.active").id;
  if (tab === "tab-login")    handleAdminLogin();
  if (tab === "tab-register") handleAdminRegister();
});
</script>
</body>
</html>
