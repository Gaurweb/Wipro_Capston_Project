<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyFinBank — Support</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">⬡ <span>MyFin</span>Bank</div>
  <div class="navbar-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="transactions.html">Transactions</a>
    <a href="loans.html">Loans</a>
    <a href="investments.html">Invest</a>
    <a href="emi.html">EMI Calc</a>
    <a href="support.html" class="active">Support</a>
  </div>
  <div class="navbar-user">
    Hello, <strong id="nav-username">—</strong>
    &nbsp;
    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-item" onclick="location.href='dashboard.html'">
      <span class="icon">🏠</span> Dashboard
    </div>
    <div class="sidebar-item" onclick="location.href='transactions.html'">
      <span class="icon">📋</span> Transactions
    </div>
    <div class="sidebar-item" onclick="location.href='loans.html'">
      <span class="icon">🏦</span> Loans
    </div>
    <div class="sidebar-item" onclick="location.href='investments.html'">
      <span class="icon">📈</span> Investments
    </div>
    <div class="sidebar-item" onclick="location.href='emi.html'">
      <span class="icon">🧮</span> EMI Calculator
    </div>
    <div class="sidebar-item active" onclick="location.href='support.html'">
      <span class="icon">💬</span> Support
    </div>
    <div class="divider"></div>
    <div class="sidebar-item" onclick="logout()">
      <span class="icon">🚪</span> Logout
    </div>
  </aside>

  <main class="main-content">

    <div class="page-header">
      <h2>Support / Chat Query</h2>
      <p>Submit your issue. Admin will reply from admin panel.</p>
    </div>

    <div class="grid-2">

      <div class="card">
        <div class="card-title">💬 Ask a Query</div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="support-subject" placeholder="Example: Unable to transfer money"/>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea id="support-message" rows="6" placeholder="Write your problem here..."></textarea>
        </div>

        <button class="btn btn-primary btn-full" onclick="submitSupportTicket()">
          Submit Query
        </button>
      </div>

      <div class="card">
        <div class="card-title">📨 My Queries</div>
        <div id="support-ticket-list">
          Loading...
        </div>
      </div>

    </div>

  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/support.js"></script>

</body>
</html>
