# ===================================================================
# Application Server Settings
# ===================================================================
# The standard network port reserved for the Eureka discovery server
server.port=8761
# The name identifying this application in your microservice network
spring.application.name=eureka-server

# ===================================================================
# Eureka Client Configuration (Self-Registration Rules)
# ===================================================================
# Prevents the Eureka server from trying to register with itself as a client
eureka.client.register-with-eureka=false
# Prevents the Eureka server from trying to fetch a registry list from itself
eureka.client.fetch-registry=false
# Disables the default wait time for peer synchronization during startup (optimal for a single-node local setup)
eureka.server.wait-time-in-ms-when-sync-empty=0

# ===================================================================
# Eureka Instance & Service URL Settings
# ===================================================================
# The host address where this Eureka dashboard and server instance is running
eureka.instance.hostname=localhost
# The complete endpoint URL where client microservices must connect to register themselves
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
